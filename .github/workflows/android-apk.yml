name: Android APK Build

# Pizza and Bird : 피자와 새 — APK 자동 빌드 (베타 테스트 배포용)
#
# - main / arena/** 브랜치에 push 하면 debug + release APK를 아티팩트로 업로드
# - v* 태그를 push 하면 GitHub Release에 APK 첨부
# - 시크릿(PB_KEYSTORE_BASE64 등)을 등록하면 정식 키로 서명된 release APK 생성
#   (등록 안 하면 debug 키로 서명된 release APK — 베타 테스트용으로 충분)
#
# 시크릿 등록 방법 (권장 — 나중에 플레이스토어 출시 시 필수):
#   keytool -genkeypair -v -keystore release.keystore -alias pizzaandbird \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore > keystore.b64
#   GitHub 저장소 Settings > Secrets and variables > Actions 에 등록:
#     PB_KEYSTORE_BASE64 = keystore.b64 내용
#     PB_KEYSTORE_PASSWORD = 키스토어 비밀번호
#     PB_KEY_ALIAS = pizzaandbird
#     PB_KEY_PASSWORD = 키 비밀번호

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        env:
          PB_KEYSTORE_BASE64: ${{ secrets.PB_KEYSTORE_BASE64 }}
          PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
          PB_KEY_ALIAS: ${{ secrets.PB_KEY_ALIAS }}
          PB_KEY_PASSWORD: ${{ secrets.PB_KEY_PASSWORD }}
        run: |
          if [ -n "$PB_KEYSTORE_BASE64" ]; then
            echo "$PB_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease --stacktrace \
              -PpbKeystore="$PWD/app/release.keystore" \
              -PpbStorePassword="$PB_KEYSTORE_PASSWORD" \
              -PpbKeyAlias="$PB_KEY_ALIAS" \
              -PpbKeyPassword="$PB_KEY_PASSWORD"
            rm -f app/release.keystore
          else
            echo "시크릿 키스토어 없음 — debug 키로 서명된 release APK를 빌드합니다 (베타용)."
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pizza-and-bird-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pizza-and-bird-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: pizza-and-bird-*-apk
          merge-multiple: true
          path: apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          prerelease: true
