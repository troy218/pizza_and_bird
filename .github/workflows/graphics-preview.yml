name: Graphics Preview

# Pizza and Bird : 피자와 새 — 그래픽 프리뷰 파이프라인
#
# 게임 렌더링 코드를 JVM(Java2D 스텁) 위에서 그대로 실행해 모든 화면의 스크린샷을
# preview/ 폴더에 PNG으로 커밋한다. 그래픽 작업 시 실제 눈으로 보며 반복할 수 있다.
#   - 01_tiles / 02_sprites / 03_birds : 아트 시트
#   - 04~27 : 타이틀/지역선택/월드(시간대별)/집/오버레이 스크린샷
# 커밋 메시지에 [skip ci]가 있어 무한 루프 없음.

on:
  push:
    branches: [arena/01a0e0d9-pizza-and-bird]
    paths:
      - 'app/src/main/java/**'
      - 'tools/preview/**'
      - '.github/workflows/graphics-preview.yml'
  workflow_dispatch:

concurrency:
  group: graphics-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview:
    name: Render preview screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Korean font
        run: |
          mkdir -p tools/preview/fonts
          curl -fsSL --retry 3 -o tools/preview/fonts/NotoSansKR-Regular.ttf \
            https://notofonts.github.io/korean/fonts/NotoSansKR/hinted/ttf/NotoSansKR-Regular.ttf
          curl -fsSL --retry 3 -o tools/preview/fonts/NotoSansKR-Bold.ttf \
            https://notofonts.github.io/korean/fonts/NotoSansKR/hinted/ttf/NotoSansKR-Bold.ttf
          ls -la tools/preview/fonts

      - name: Download Kotlin compiler
        run: |
          curl -fsSL --retry 3 -o /tmp/kc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp
          /tmp/kotlinc/bin/kotlinc -version

      - name: Compile (game + preview stubs)
        run: |
          GAME_SRCS=$(find app/src/main/java/com/pizzaandbird/game -name '*.kt' \
            ! -name 'MainActivity.kt' ! -name 'GameView.kt')
          /tmp/kotlinc/bin/kotlinc \
            tools/preview/src/android_stubs_graphics.kt \
            tools/preview/src/android_stubs_content.kt \
            tools/preview/src/android_stubs_os.kt \
            tools/preview/src/android_stubs_view.kt \
            tools/preview/src/json_stubs.kt \
            tools/preview/src/mainactivity_stub.kt \
            tools/preview/src/preview_main.kt \
            $GAME_SRCS \
            -include-runtime -d preview.jar \
            -main-class com.pizzaandbird.preview.PreviewMain \
            -jvm-target 17

      - name: Render screenshots
        run: |
          java -jar preview.jar preview_out
          ls -la preview_out

      - name: Commit preview PNGs
        run: |
          mkdir -p preview
          rm -f preview/*.png
          cp preview_out/*.png preview/
          git config user.name "arena-preview-bot"
          git config user.email "arena-preview-bot@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then
            echo "no preview changes"
          else
            git commit -m "preview: update rendered screenshots [skip ci]"
            git push
          fi
